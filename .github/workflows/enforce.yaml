---
jobs:
  enforce:
    name: Enforce Repository Rulesets
    runs-on: ubuntu-24.04
    steps:
      # Checkout the repository
      # https://github.com/actions/checkout
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Set up uv
      # https://github.com/astral-sh/setup-uv
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # Execute the enforcement script
      - name: Execute enforcement script
        run: |
          uv run main.py \
            --debug \
            --exclude-required-check Analyze \
            --exclude-required-check dependency-review \
            --exclude-required-check "Create Draft Release" \
            --token ${{ secrets.GH_ENFORCE_PAT }} \
            --user MattKobayashi
name: Enforce Repository Rulesets
on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
