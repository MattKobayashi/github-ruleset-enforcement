---
jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      # Checkout the repository
      # https://github.com/actions/checkout
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Set up uv
      # https://github.com/astral-sh/setup-uv
      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      # Execute the enforcement script (dry-run)
      - name: Execute enforcement script (dry-run)
        run: |
          uv run main.py \
            --debug \
            --dry-run \
            --exclude-required-check Analyze \
            --exclude-required-check dependency-review \
            --token ${{ secrets.GH_ENFORCE_PAT }} \
            --user MattKobayashi
name: Test
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
